name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install, build, upload
        uses: withastro/action@v3
        # Falls als Project Pages unter <user>.github.io/<repo> deployed wird,
        # eventuell `with: { path: '.' }` und in astro.config.mjs `base: '/<repo>'`
        # setzen. Bei Custom-Domain (CNAME) NICHT nötig.

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
